name: CI

on:
    push:
        branches:
            - main

    pull_request:
        branches:
            - main

jobs:
    backend: 
        name: Backend
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: install python
              uses: actions/setup-python@v5
              with:
                python-version: "3.13"

            - name: install dependencies
              run: |
                pip install -r requirements-dev.txt

            - name: run tests
              run: |
                pytest

    frontend:
        name: Frontend
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: install node
              uses: actions/setup-node@v4
              with:
                node-version: "22"

            - name: install dependencies
              run: |
                npm ci

            - name: lint
              run: |
                npm run lint

            - name: build
              run: |
                npm run build


